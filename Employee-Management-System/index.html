<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <h1>Employee Management System</h1>
    <div id="statistics">
      <span id="totalEmployee">totalEmployee</span>
      <span id="active">active</span>
      <span id="inactive">inactive</span>
      <span id="averageSalary">averageSalary</span>
      <span id="highestSalary">highestSalary</span>
      <span id="lowestSalary">lowestSalary</span>
    </div>
  </header>
  <main>
    <section class="inputData">
      <div class="formBox">
        <form action="" id="myForm">
          <label for="name">Name</label>
          <input type="text" name="name" id="name" required />
          <label for="email">Email</label>
          <input type="email" name="email" id="email" required />
          <label for="department">Department</label>

          <label for="it"><input type="radio" name="department" value="IT" id="it" required />IT</label>

          <label for="hr"><input type="radio" name="department" value="HR" id="hr" required />HR</label>

          <label for="finance"><input type="radio" name="department" value="FINANCE" id="finance"
              required />FINANCE</label>
          <label for="salary">Salary</label>
          <input type="number" name="salary" id="salary" required />
          <label for="experience">Experience</label>
          <input type="number" name="experience" id="experience" required />
          <button type="submit" id="submit">Submit</button>
        </form>
      </div>
    </section>
    <section class="showData">
      <h1>Employees List</h1>
      <span>
        <label for="search">Search</label>
        <input type="search" name="search" id="search" placeholder="Search by name of department" /></span>
      <span>
        Status
        <select name="status" id="status">
          <option value="all">All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select></span><span>
        Department
        <select name="departments" id="searchdepartment">
          <option value="all">ALL</option>
          <option value="it">IT</option>
          <option value="hr">HR</option>
          <option value="finance">FINANCE</option>
        </select></span> <span> Min Salary
        <input type="number" name="minSalary" id="minSalary" placeholder="Enter min salary"></span><span> Max Salary
        <input type="number" name="maxSalary" id="maxSalary" placeholder="Enter max slary">
      </span>
      <span>Sort<select name="sortBtn" id="sortBtn">
          <option value="all">ALL</option>
          <option value="nameA-Z">NAME A-Z</option>
          <option value="nameZ-A">NAME Z-A</option>
          <option value="salaryMin">Min Salary</option>
          <option value="salaryMax">Max Salary</option>
          <option value="experienceMin">Min Experience</option>
          <option value="experienceMax">Max Experience</option>
        </select></span>
      <div id="employeeList"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
